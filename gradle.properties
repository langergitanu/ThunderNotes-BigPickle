# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# JVM args for the Gradle daemon — generous heap so Room/KSP don't OOM on big builds.
org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
org.gradle.parallel=true

# When enabled, the Configuration Cache allows Gradle to skip the configuration
# phase entirely if nothing that affects the build configuration (such as build scripts)
# has changed. Additionally, Gradle applies performance optimizations for task execution.
org.gradle.configuration-cache=true

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
kotlin.incremental=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 9 turns on "built-in Kotlin" by default; we rely on it (the standalone
# org.jetbrains.kotlin.android plugin is not compatible with AGP 9). The
# kotlin/ksp versions in gradle/libs.versions.toml are matched to it.
# AGP 9 enables "built-in Kotlin" by default, but KSP (needed for Room) is not
# compatible with it. Opt out and use the standalone Kotlin Gradle plugin.
android.builtInKotlin=false
# The standalone Kotlin plugin (required by KSP/Room) does not support the
# AGP 9.0 new DSL yet. Keep the legacy DSL so kotlin("android") + KSP can apply.
android.newDsl=false
